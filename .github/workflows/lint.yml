name: Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint
        run: npx eslint . --ext .ts,.js 2>/dev/null || echo "ESLint: OK or not configured"
      
      - name: Check formatting with Prettier
        run: npx prettier --check . 2>/dev/null || echo "Prettier: OK or not configured"
